<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Friends — Learn & Play</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<div class="app">

  <header class="top">
    <div class="brand">
      <h1>Number Friends</h1>
      <p>Learn numbers 1 to 50 with pictures, sounds and games!</p>
    </div>
    <div class="star-badge" id="star-badge">
      <div class="star-shape"></div>
      <div>
        <span class="star-count" id="star-count">0</span>
        <span class="star-label">Stars</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="active" data-target="panel-learn">Learn Numbers</button>
    <button data-target="panel-practice">Practice & Play</button>
    <button data-target="panel-bonus">Numbers 31–50</button>
  </nav>

  <!-- LEARN PANEL -->
  <section class="panel active" id="panel-learn">
    <div class="learn-wrap">
      <div class="card-stage">
        <button class="nav-arrow prev" id="btn-prev" aria-label="Previous number"><span class="tri"></span></button>
        <div class="flash-card" id="flash-card">
          <img id="learn-img" src="" alt="">
          <span class="learned-tag" id="learned-tag">Card Learned!</span>
        </div>
        <button class="nav-arrow next" id="btn-next" aria-label="Next number"><span class="tri"></span></button>
      </div>

      <div class="btn-row">
        <button class="btn listen" id="btn-listen"><span class="speaker-icon"></span>Hear the Number</button>
        <button class="btn sentence" id="btn-sentence"><span class="speaker-icon"></span>Read Entire Sentence</button>
      </div>

      <div class="sentence-box" id="sentence-box"></div>

      <div class="progress-dots" id="progress-dots"></div>
    </div>
  </section>

  <!-- PRACTICE PANEL -->
  <section class="panel" id="panel-practice">
    <div class="practice-wrap">
      <div class="practice-status" id="practice-status-wrap">
        <span id="practice-status-text"></span>
      </div>
      <div id="practice-body">
        <p class="practice-instruction">Ready to test what you've learned?</p>
        <div class="btn-row">
          <button class="btn primary" id="start-quiz-btn">Start Practice</button>
        </div>
      </div>
    </div>
  </section>

  <!-- BONUS PANEL -->
  <section class="panel" id="panel-bonus">
    <div class="bonus-wrap" id="bonus-wrap"></div>
  </section>

  <footer class="credit">Made with the Number Friends flashcard set • For little learners 4+</footer>
</div>

<script src="js/data.js"></script>
<script src="js/confetti.js"></script>
<script src="js/speech.js"></script>
<script src="js/app.js"></script>
</body>
</html>
